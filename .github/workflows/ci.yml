name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'app[dev]'
      - run: cd app && pytest -q

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Start stack (bitcoind + 2 LND + bootstrap + app, regtest)
        run: docker compose up --build -d
        env:
          BOUTIK_RATE_SOURCE: fixed
      - name: Happy path against real LND
        run: ./scripts/e2e.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
